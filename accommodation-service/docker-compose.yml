version: "3.9"

# STUDENT 1 MICROSERVICE — its own independent project.
# Internal ports fixed (3000/5000/6000). External ports = 3001 / 5001 / 6001.

services:
  frontend:
    build: ./frontend
    container_name: accomodation-fe
    ports:
      - "3002:3000"          # external:internal
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build: ./backend
    container_name: accomodation-be
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
    depends_on:
      - database
    networks:
      - internal               # backends never talk to each other

  database:
    build: ./database
    container_name: accomodation-db
    ports:
      - "6002:6000"
    environment:
      - DB_FILE=/data/accomodation-db.sqlite
    volumes:
      - accomodation-db-data:/data
    networks:
      - internal
      - microservices-net       # reachable by other projects as http://student1-db:6000

networks:
  internal:
    driver: bridge
  microservices-net:
    external: true

volumes:
  accomodation-db-data:
