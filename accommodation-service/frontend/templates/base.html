<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Accommodation Manager{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <nav class="voyage-nav">
    <div class="voyage-nav__container">
      <span class="voyage-nav__brand">VoyageAI — Accommodations</span>
      <div class="voyage-nav__links">
        <a href="http://localhost:3000">Home</a>
        <a href="{{ url_for('index') }}">List</a>
        <a href="{{ url_for('recommend_page') }}">Recommend</a>
        <a href="{{ url_for('new_accommodation_form') }}">New</a>
      </div>
    </div>
  </nav>

  <main class="voyage-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="voyage-footer">
    VoyageAI &mdash; Accommodation Manager
  </footer>
</body>
</html>
