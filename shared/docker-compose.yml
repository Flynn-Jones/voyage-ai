# SHARED MICROSERVICE — its own independent project.
# External ports = internal ports (3000/5000/6000) since this is the canonical service.

services:
  frontend:
    container_name: shared-fe
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - ACCESS_SERVICE_URL=http://backend:5000
    networks:
      - internal

  backend:
    container_name: shared-be
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    depends_on:
      - database
    networks:
      - internal

  database:
    container_name: shared-db
    build:
      context: .
      dockerfile: database/Dockerfile
    ports:
      - "6000:6000"
    environment:
      - DB_FILE=/data/shared-db.sqlite
    volumes:
      - shared-db-data:/data
    networks:
      - internal
      - microservices-net     # reachable by other projects as http://shared-db:6000

networks:
  internal:
    driver: bridge
  microservices-net:
    external: true            # created once: docker network create microservices-net

volumes:
  shared-db-data:
