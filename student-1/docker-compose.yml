# STUDENT 1 MICROSERVICE — Destination Manager, its own independent project.
# Ports: frontend 3001, backend 5001, database 6001 (internal == external).
#
# Session 1 scope: three-service skeleton with /health only, proving the
# architecture (frontend -> backend -> database API -> SQLite) before any
# CRUD or AI logic lands. Unique service/network/volume names below so this
# file can later be included in the shared root docker-compose.yml without
# colliding with the other students' generic frontend/backend/database keys.

services:
  destination-frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BACKEND_SERVICE_URL=http://destination-backend:5001
      # Release 1: frontend -> backend read timeouts (seconds); keep them
      # above the backend's own MCP 10 / RAG 120 so its envelope arrives first.
      - MCP_REQUEST_TIMEOUT_SECONDS=${MCP_REQUEST_TIMEOUT_SECONDS:-15}
      - RAG_REQUEST_TIMEOUT_SECONDS=${RAG_REQUEST_TIMEOUT_SECONDS:-130}
    depends_on:
      - destination-backend
    networks:
      - student-1-internal

  destination-backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      DATABASE_SERVICE_URL: http://destination-database:6001
      # Ollama config: overridable from the shell or an uncommitted local
      # .env (see .env.example) without editing this file.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      # Release 1: ONE shared local MCP (:7001) and RAG (:7002) on the host.
      # Literal URLs on purpose (not ${MCP_SERVICE_URL}): the root compose uses
      # that shell var for Activity's 7003/6013 servers.
      MCP_SERVICE_URL: http://host.docker.internal:7001
      MCP_ENABLED: ${DESTINATION_MCP_ENABLED:-true}
      MCP_TIMEOUT_SECONDS: "10"
      RAG_SERVICE_URL: http://host.docker.internal:7002
      RAG_ENABLED: ${DESTINATION_RAG_ENABLED:-true}
      RAG_TIMEOUT_SECONDS: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - destination-database
    networks:
      - student-1-internal

  destination-database:
    build: ./database
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - DB_FILE=/data/destination-db.sqlite
    volumes:
      - destination-db-data:/data
    networks:
      student-1-internal:
      microservices-net:
        aliases:
          - destination-db

networks:
  student-1-internal:
    driver: bridge
  microservices-net:
    external: true            # created once: docker network create microservices-net

volumes:
  destination-db-data:
