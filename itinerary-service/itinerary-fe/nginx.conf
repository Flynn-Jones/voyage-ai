server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Establishes the frontend-to-backend boundary for later API calls.
    # A shared run can include Planner/Reviewer retries (420s backend timeout by default).
    location /api/itinerary/multi-agent/ {
        proxy_pass http://itinerary-be:5005;
        proxy_read_timeout 650s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else on /api/, including /api/itinerary/ai-review, which waits on a real
    # Ollama generation. Without this nginx applies its 60s default and the browser sees a
    # 504 for a request the backend is still happily serving (ai-review measured ~56s - it
    # was inside the margin). See docs/release-2/cloud/ai-timeouts.md.
    location /api/ {
        proxy_pass http://itinerary-be:5005;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
