<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="voyage-nav">
    <div class="voyage-nav__container">
        <span class="voyage-nav__brand">VoyageAI &mdash; Budget</span>
        <div class="voyage-nav__switcher">
            <a href="http://localhost:3000">Home</a>
            <a href="http://localhost:3001">Destinations</a>
            <a href="http://localhost:3002">Accommodation</a>
            <a href="http://localhost:3003">Activities</a>
            <a href="http://localhost:3004" class="is-active">Budget</a>
            <a href="http://localhost:3005">Itinerary</a>
        </div>
    </div>
</nav>
<main class="voyage-main">
    <header class="voyage-hero">
        <div>
            <p class="eyebrow">Student 4</p>
            <h1>Your budget</h1>
            <p>Track estimated and actual trip spending.</p>
        </div>
    </header>

    <section class="tab-shell card">
        <nav class="tab-nav" aria-label="Application tabs">
            <button class="tab-btn is-active" data-tab="normal" type="button">Normal UI</button>
            <button class="tab-btn" data-tab="ai-mode" type="button">AI Mode</button>
        </nav>

        <div class="tab-content">
            <iframe id="tab-frame-normal" class="tab-frame is-active" src="tabs/normal.html" title="Normal UI tab"></iframe>
            <iframe id="tab-frame-ai-mode" class="tab-frame" src="tabs/ai-mode.html" title="AI Mode tab"></iframe>
        </div>
    </section>
</main>
<footer class="voyage-footer">VoyageAI &mdash; Budget Manager</footer>

<script>
const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
const tabFrames = {
    normal: document.getElementById("tab-frame-normal"),
    "ai-mode": document.getElementById("tab-frame-ai-mode"),
};

const frameObservers = new WeakMap();

function syncFrameHeight(frame) {
    try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;
        // documentElement and body can disagree depending on layout/browser;
        // take the larger so tab content is never clipped.
        const height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
        if (height) frame.style.height = height + "px";
    } catch (error) {
        /* frame not ready yet — the load/observer will retry */
    }
}

function observeFrame(frame) {
    syncFrameHeight(frame);
    if (frameObservers.has(frame)) return; // one observer per frame, reused
    const doc = frame.contentDocument;
    if (!doc || !doc.body) return;
    const observer = new ResizeObserver(() => syncFrameHeight(frame));
    observer.observe(doc.body);
    observer.observe(doc.documentElement);
    frameObservers.set(frame, observer);
}

function activateTab(tabName) {
    tabButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === tabName);
    });

    Object.entries(tabFrames).forEach(([name, frame]) => {
        frame.classList.toggle("is-active", name === tabName);
    });

    window.location.hash = tabName;
    syncFrameHeight(tabFrames[tabName]);
}

tabButtons.forEach((button) => {
    if (button.disabled) {
        return;
    }

    button.addEventListener("click", () => {
        activateTab(button.dataset.tab);
    });
});

Object.values(tabFrames).forEach((frame) => {
    frame.addEventListener("load", () => observeFrame(frame));
});

const hashTab = window.location.hash.replace("#", "");
if (hashTab && tabFrames[hashTab]) {
    activateTab(hashTab);
} else {
    activateTab("normal");
}
</script>

</body>
</html>
