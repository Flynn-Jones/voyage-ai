<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal UI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { margin: 0; min-height: auto; background: transparent; }
        .app-shell, .voyage-main { max-width: none; padding: 0; }
    </style>
</head>
<body>
<main class="app-shell">
    <section class="card">
        <h2>Budget Dashboard</h2>
        <div id="dashboard-stats" class="dashboard-stats"></div>
        <div id="category-chart" class="category-chart"></div>
    </section>

    <section class="card">
        <h2>Expenses</h2>

        <div class="filter-row">
            <input id="filter-category" type="text" placeholder="Category">
            <select id="filter-status">
                <option value="">Any status</option>
                <option value="Planned">Planned</option>
                <option value="Paid">Paid</option>
                <option value="Cancelled">Cancelled</option>
            </select>
            <input id="filter-destination-id" type="number" min="1" placeholder="Destination ID">
            <button id="apply-filters-btn" class="button button--primary" type="button">Apply Filters</button>
            <button id="clear-filters-btn" class="button button--secondary" type="button">Clear</button>
        </div>

        <div id="expense-list-panel" class="panel"></div>
    </section>

    <section class="card">
        <h2>Add Expense</h2>

        <form id="create-form">
            <div class="field-row">
                <div>
                    <label for="create_trip_reference">Trip Reference</label>
                    <input id="create_trip_reference" name="trip_reference" type="text" placeholder="TRIP-1001" required>
                </div>
                <div>
                    <label for="create_expense">Expense</label>
                    <input id="create_expense" name="expense" type="text" placeholder="Flight to Paris" required>
                </div>
                <div>
                    <label for="create_category">Category</label>
                    <input id="create_category" name="category" type="text" placeholder="Transport" required>
                </div>
                <div>
                    <label for="create_estimated_cost">Estimated Cost</label>
                    <input id="create_estimated_cost" name="estimated_cost" type="number" step="0.01" min="0" required>
                </div>
                <div>
                    <label for="create_actual_cost">Actual Cost (optional)</label>
                    <input id="create_actual_cost" name="actual_cost" type="number" step="0.01" min="0">
                </div>
                <div>
                    <label for="create_destination_id">Destination ID</label>
                    <input id="create_destination_id" name="destination_id" type="number" min="1" required>
                </div>
                <div>
                    <label for="create_status">Status</label>
                    <select id="create_status" name="status">
                        <option value="Planned">Planned</option>
                        <option value="Paid">Paid</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="button button--primary">Create Expense</button>
        </form>

        <div id="create-result" class="panel"></div>
    </section>

    <section class="card">
        <h2>Edit Expense</h2>
        <p class="rag-helper">Leave a field blank to keep its current value.</p>

        <form id="edit-form">
            <div class="field-row">
                <div>
                    <label for="edit_id">Expense ID</label>
                    <input id="edit_id" name="id" type="number" min="1" required>
                </div>
                <div>
                    <label for="edit_trip_reference">Trip Reference</label>
                    <input id="edit_trip_reference" name="trip_reference" type="text">
                </div>
                <div>
                    <label for="edit_expense">Expense</label>
                    <input id="edit_expense" name="expense" type="text">
                </div>
                <div>
                    <label for="edit_category">Category</label>
                    <input id="edit_category" name="category" type="text">
                </div>
                <div>
                    <label for="edit_estimated_cost">Estimated Cost</label>
                    <input id="edit_estimated_cost" name="estimated_cost" type="number" step="0.01" min="0">
                </div>
                <div>
                    <label for="edit_actual_cost">Actual Cost</label>
                    <input id="edit_actual_cost" name="actual_cost" type="number" step="0.01" min="0">
                </div>
                <div>
                    <label for="edit_destination_id">Destination ID</label>
                    <input id="edit_destination_id" name="destination_id" type="number" min="1">
                </div>
                <div>
                    <label for="edit_status">Status</label>
                    <select id="edit_status" name="status">
                        <option value="">-- no change --</option>
                        <option value="Planned">Planned</option>
                        <option value="Paid">Paid</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="button button--primary">Update Expense</button>
        </form>

        <div id="edit-result" class="panel"></div>
    </section>

    <section class="card">
        <h2>Delete Expense</h2>

        <form id="delete-form">
            <label for="delete_id">Expense ID</label>
            <input id="delete_id" name="id" type="number" min="1" required>
            <button type="submit" class="button button--danger">Delete Expense</button>
        </form>

        <div id="delete-result" class="panel"></div>
    </section>
</main>

<script>
const API_BASE = "http://localhost:5004";

const expenseListPanel = document.getElementById("expense-list-panel");
const dashboardStats = document.getElementById("dashboard-stats");
const categoryChart = document.getElementById("category-chart");

// VoyageAI categorical palette, fixed hue order (see shared/design-system).
// Assigned by position in the sorted category list, not by name — the pie's
// slices only touch their immediate neighbours, and this order is the one
// validated as safe for every adjacent pair. Past 8 categories, colors repeat.
const CATEGORY_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

const filterCategory = document.getElementById("filter-category");
const filterStatus = document.getElementById("filter-status");
const filterDestinationId = document.getElementById("filter-destination-id");

const createForm = document.getElementById("create-form");
const editForm = document.getElementById("edit-form");
const deleteForm = document.getElementById("delete-form");

function buildFilterQuery() {
    const params = new URLSearchParams();
    if (filterCategory.value.trim()) params.set("category", filterCategory.value.trim());
    if (filterStatus.value) params.set("status", filterStatus.value);
    if (filterDestinationId.value) params.set("destination_id", filterDestinationId.value);
    const query = params.toString();
    return query ? `?${query}` : "";
}

function formatCurrency(value) {
    return `$${value.toFixed(2)}`;
}

function updateDashboard() {
    const rows = expenseListPanel.querySelectorAll("tr[data-expense-id]");
    let totalEstimated = 0;
    let totalActual = 0;
    const categories = {};

    rows.forEach((row) => {
        const category = row.cells[3].textContent;
        const estimated = parseFloat(row.cells[4].textContent.replace("$", "")) || 0;
        const actualText = row.cells[5].textContent;
        const actual = actualText === "-" ? null : parseFloat(actualText.replace("$", "")) || 0;

        totalEstimated += estimated;
        if (actual !== null) totalActual += actual;

        if (!categories[category]) categories[category] = { count: 0, estimated: 0 };
        categories[category].count += 1;
        categories[category].estimated += estimated;
    });

    const ratio = totalEstimated > 0 ? totalActual / totalEstimated : 0;
    const severity = ratio > 1 ? "danger" : ratio >= 0.9 ? "warning" : "";
    const trackClass = severity ? ` budget-meter__track--${severity}` : "";
    const fillClass = severity ? ` budget-meter__fill--${severity}` : "";
    const fillWidth = Math.min(ratio, 1) * 100;
    const overNote = ratio > 1
        ? `<span class="budget-meter__note">${formatCurrency(totalActual - totalEstimated)} over estimate</span>`
        : "";

    dashboardStats.innerHTML = `
        <div class="stat-card">
            <span class="stat-label">Expenses</span>
            <span class="stat-value">${rows.length}</span>
        </div>
        <div class="stat-card stat-card--meter">
            <span class="stat-label">Actual vs Estimated</span>
            <div class="budget-meter__values">
                <span class="budget-meter__value">${formatCurrency(totalActual)}</span>
                <span class="budget-meter__of">of ${formatCurrency(totalEstimated)}</span>
            </div>
            <div class="budget-meter__track${trackClass}" role="img" aria-label="${formatCurrency(totalActual)} spent of ${formatCurrency(totalEstimated)} estimated">
                <div class="budget-meter__fill${fillClass}" style="width: ${fillWidth}%"></div>
            </div>
            ${overNote}
        </div>
    `;

    renderCategoryChart(categories, totalEstimated);
}

function renderCategoryChart(categories, totalEstimated) {
    const entries = Object.entries(categories).sort((a, b) => b[1].estimated - a[1].estimated);

    if (!entries.length || totalEstimated <= 0) {
        categoryChart.innerHTML = '<p class="empty">No expenses to break down.</p>';
        return;
    }

    const radius = 15.9155;
    const gap = entries.length > 1 ? 1.2 : 0;
    let offset = 25;

    const arcs = entries.map(([name, data], index) => {
        const percent = (data.estimated / totalEstimated) * 100;
        const dash = Math.max(percent - gap, 0);
        const color = CATEGORY_COLORS[index % CATEGORY_COLORS.length];
        const circle = `<circle class="category-chart__arc" cx="18" cy="18" r="${radius}" fill="none"
            stroke="${color}" stroke-width="4"
            stroke-dasharray="${dash} ${100 - dash}" stroke-dashoffset="${offset}"><title>${escapeHtml(name)}: ${formatCurrency(data.estimated)} (${percent.toFixed(1)}%)</title></circle>`;
        offset -= percent;
        return circle;
    }).join("");

    const legend = entries.map(([name, data], index) => {
        const percent = (data.estimated / totalEstimated) * 100;
        const color = CATEGORY_COLORS[index % CATEGORY_COLORS.length];
        return `<li>
            <span class="category-legend__name">
                <span class="category-legend__swatch" style="background: ${color}"></span>
                <span class="category-legend__label">${escapeHtml(name)} (${data.count})</span>
            </span>
            <span class="category-legend__value">${formatCurrency(data.estimated)} &middot; ${percent.toFixed(0)}%</span>
        </li>`;
    }).join("");

    categoryChart.innerHTML = `
        <svg class="category-chart__pie" viewBox="0 0 36 36" role="img" aria-label="Estimated spend by category">${arcs}</svg>
        <ul class="category-legend">${legend}</ul>
    `;
}

async function refreshList() {
    try {
        const response = await fetch(`${API_BASE}/expenses${buildFilterQuery()}`);
        expenseListPanel.innerHTML = await response.text();
    } catch (error) {
        expenseListPanel.innerHTML = `<p class="error">Request failed: ${error}</p>`;
    }
    updateDashboard();
}

document.getElementById("apply-filters-btn").addEventListener("click", refreshList);
document.getElementById("clear-filters-btn").addEventListener("click", () => {
    filterCategory.value = "";
    filterStatus.value = "";
    filterDestinationId.value = "";
    refreshList();
});

createForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(createForm);
    const payload = {
        trip_reference: formData.get("trip_reference"),
        expense: formData.get("expense"),
        category: formData.get("category"),
        estimated_cost: Number(formData.get("estimated_cost")),
        destination_id: Number(formData.get("destination_id")),
        status: formData.get("status"),
    };
    const actualCost = formData.get("actual_cost");
    if (actualCost) payload.actual_cost = Number(actualCost);

    const panel = document.getElementById("create-result");
    try {
        const response = await fetch(`${API_BASE}/expenses`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        panel.innerHTML = await response.text();
        if (response.ok) {
            createForm.reset();
            refreshList();
        }
    } catch (error) {
        panel.innerHTML = `<p class="error">Request failed: ${error}</p>`;
    }
});

editForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(editForm);
    const id = formData.get("id");
    const payload = {};

    ["trip_reference", "expense", "category", "status"].forEach((field) => {
        const value = formData.get(field);
        if (value) payload[field] = value;
    });
    ["estimated_cost", "actual_cost", "destination_id"].forEach((field) => {
        const value = formData.get(field);
        if (value) payload[field] = Number(value);
    });

    const panel = document.getElementById("edit-result");
    try {
        const response = await fetch(`${API_BASE}/expenses/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        panel.innerHTML = await response.text();
        if (response.ok) refreshList();
    } catch (error) {
        panel.innerHTML = `<p class="error">Request failed: ${error}</p>`;
    }
});

deleteForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(deleteForm);
    const id = formData.get("id");

    const panel = document.getElementById("delete-result");
    try {
        const response = await fetch(`${API_BASE}/expenses/${id}`, { method: "DELETE" });
        if (response.status === 204) {
            panel.innerHTML = `<p>Expense ${id} deleted.</p>`;
            deleteForm.reset();
            refreshList();
        } else {
            panel.innerHTML = await response.text();
        }
    } catch (error) {
        panel.innerHTML = `<p class="error">Request failed: ${error}</p>`;
    }
});

refreshList();
</script>
</body>
</html>
