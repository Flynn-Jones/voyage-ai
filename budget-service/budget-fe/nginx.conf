server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Same-origin API: the browser calls /api/..., nginx forwards it to the backend, so no
    # localhost URL ever reaches the browser. "budget-backend:5004" resolves in the root compose
    # file, in budget-service/docker-compose.yml (network alias) and on AWS (Service Connect).
    location /api/ {
        proxy_pass http://budget-backend:5004/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must exceed the backend's own Multi-Agent ceiling (420s) so its JSON error
        # reaches the browser instead of nginx cutting the connection first.
        # See docs/release-2/cloud/ai-timeouts.md.
        proxy_read_timeout 480s;
    }
}
