version: "3.9"

# STUDENT 4 MICROSERVICE — its own independent project.
# Internal ports fixed (3000/5000/6000). External ports = 3004 / 5004 / 6004.

services:
  frontend:
    build: ./frontend
    container_name: budget-fe
    ports:
      - "3004:3000"          # external:internal
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build: ./backend
    container_name: budget-be
    ports:
      - "5004:5000"
    environment:
      - PORT=5000
    depends_on:
      - database
    networks:
      - internal               # backends never talk to each other

  database:
    build: ./database
    container_name: budget-db
    ports:
      - "6004:6000"
    environment:
      - DB_FILE=/data/budget-db.sqlite
    volumes:
      - budget-db-data:/data
    networks:
      - internal
      - microservices-net       # reachable by other projects as http://student4-db:6000

networks:
  internal:
    driver: bridge
  microservices-net:
    external: true

volumes:
  budget-db-data:
