name: student-5

on:
  workflow_dispatch:
  push:
    branches: [main, student-5/itinerary-feature]
    paths:
      - "itinerary-service/**"
      - "docs/release-2/student-5/**"
      - ".github/workflows/student-5.yml"
      - "ai-services/mcp-server/**"
      - "ai-services/rag-server/**"
      - "ai-services/agentic_loop/**"
      - "ai-services/multi-agent-server/**"
      - "prompts/mcp/**"
      - "prompts/rag/**"
      - "docker-compose.yml"

jobs:
  itinerary-release-1:
    # Retain the existing check name; this job now also validates Release 2 endpoints.
    name: Student 5 Release 1 Validation
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            itinerary-service/itinerary-be/requirements.txt
            itinerary-service/itinerary-db/requirements.txt

      - name: Install Student 5 Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r itinerary-service/itinerary-be/requirements.txt
          python -m pip install -r itinerary-service/itinerary-db/requirements.txt

      - name: Student 5 Python Validation
        run: |
          python -m compileall -q itinerary-service/itinerary-be itinerary-service/itinerary-db ai-services/mcp-server ai-services/rag-server ai-services/agentic_loop
          python -c "import sys; sys.path.insert(0, 'itinerary-service/itinerary-be'); from app import create_app; assert any(str(rule) == '/api/itinerary/ai-review' for rule in create_app().url_map.iter_rules())"

      - name: Student 5 Python Tests
        run: python -m pytest itinerary-service/itinerary-be/tests itinerary-service/itinerary-db/tests -q --junitxml=itinerary-service/reports/post-commit/junit-unit-tests.xml

      - name: Shared Itinerary Contract Tests
        run: python -m pytest itinerary-service/tests -q --junitxml=itinerary-service/reports/post-commit/junit-contract-tests.xml

      - name: Validate Docker Compose
        run: |
          docker compose -f itinerary-service/docker-compose.yml config --quiet
          docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml config --quiet

      - name: Create External Network
        run: docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net

      - name: Build Itinerary Containers
        run: docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml build itinerary-fe itinerary-be itinerary-db

      - name: Start Itinerary Services
        run: docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml up -d

      - name: Verify Container Baseline Switches
        run: |
          docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml exec -T itinerary-be python -c '
          import os
          flags = ("AI_ENABLED", "MCP_ENABLED", "RAG_ENABLED", "MULTI_AGENT_ENABLED")
          values = {key: os.environ.get(key) for key in flags}
          print(values)
          assert all(value == "false" for value in values.values()), values
          '

      - name: Backend Health Check
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://localhost:5005/health; then
              exit 0
            fi
            echo "Backend not ready (attempt $attempt/20)"
            sleep 3
          done
          docker compose -f itinerary-service/docker-compose.yml logs itinerary-be
          exit 1

      - name: Database Health Check
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://localhost:6005/health; then
              exit 0
            fi
            echo "Database API not ready (attempt $attempt/20)"
            sleep 3
          done
          docker compose -f itinerary-service/docker-compose.yml logs itinerary-db
          exit 1

      - name: Frontend Health Check
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://localhost:3005/ >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Frontend not ready (attempt $attempt/20)"
            sleep 3
          done
          docker compose -f itinerary-service/docker-compose.yml logs itinerary-fe
          exit 1

      - name: CRUD Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          api="http://localhost:5005/api/itinerary"
          item_id=""
          cleanup() {
            if [ -n "$item_id" ]; then
              curl --fail --silent --show-error --max-time 15 -X DELETE "$api/$item_id" >/dev/null
            fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error "$api" >/dev/null

          created=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"trip_reference":"CI-SMOKE","day":9,"start_time":"09:00","end_time":"10:00","activity_id":1,"destination_id":1,"estimated_cost":12.50,"notes":"Temporary CI item"}' \
            "$api")
          item_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["itinerary_item_id"])' <<< "$created")

          curl --fail --silent --show-error "$api/$item_id" >/dev/null
          curl --fail --silent --show-error \
            -X PUT -H "Content-Type: application/json" \
            -d '{"trip_reference":"CI-SMOKE","day":9,"start_time":"09:30","end_time":"10:30","activity_id":1,"destination_id":1,"estimated_cost":15.00,"notes":"Updated temporary CI item"}' \
            "$api/$item_id" >/dev/null
          curl --fail --silent --show-error "$api/day/9" | python -c 'import json,sys; records=json.load(sys.stdin); assert any(item["notes"] == "Updated temporary CI item" for item in records)'
          curl --fail --silent --show-error -X DELETE "$api/$item_id"

          status=$(curl --silent --output /dev/null --write-out "%{http_code}" "$api/$item_id")
          test "$status" = "404"
          echo "CRUD smoke test passed for temporary item $item_id"
          item_id=""

      - name: Verify Optional Services Disabled
        run: |
          for route in ai-review mcp/itinerary rag/answer rag/retrieve rag/refresh multi-agent/run; do
            body=$(mktemp)
            code=$(curl --max-time 15 -sS -o "$body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "http://localhost:5005/api/itinerary/$route")
            test "$code" = "403"
            python -c 'import json,sys; assert "disabled" in json.load(open(sys.argv[1]))["error"].lower()' "$body"
            rm -f "$body"
            echo "PASS $route -> 403 disabled"
          done

      - name: Release 2 Live POST and PUT Endpoint Tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p itinerary-service/reports/post-commit
          python -m pytest -m live itinerary-service/ci -v \
            --junitxml=itinerary-service/reports/post-commit/junit-endpoint-tests.xml \
            2>&1 | tee itinerary-service/reports/post-commit/endpoint-tests.txt

      - name: Generate Student 5 Evidence
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          python itinerary-service/ci/write_report.py
          mkdir -p itinerary-service/reports/post-commit
          cp docs/release-2/student-5/post-commit-cicd-report.md itinerary-service/reports/post-commit/

      - name: Container Logs on Failure
        if: failure()
        run: |
          mkdir -p itinerary-service/reports/post-commit
          docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml logs --no-color > itinerary-service/reports/post-commit/container-logs.txt 2>&1

      - name: Upload Student 5 Endpoint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-endpoint-tests
          path: itinerary-service/reports/post-commit
          if-no-files-found: warn

      - name: Upload Student 5 Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-report
          path: itinerary-service/reports

      - name: Cleanup
        if: always()
        run: docker compose -f itinerary-service/docker-compose.yml -f itinerary-service/docker-compose.ci.yml down --volumes --remove-orphans
