name: student-2

on:
  workflow_dispatch:
  push:
    branches: [main, feat/accomodation-service]
    paths:
      - "accommodation-service/**"
      - ".github/workflows/student-2.yml"

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)
      - name: Build services
        working-directory: accommodation-service
        run: docker-compose build
  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)
      - name: Create external network
        run: docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net
      - name: Start services
        working-directory: accommodation-service
        run: docker-compose up -d
      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""
            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi
              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done
            echo "FAIL $url after $attempts attempts"
            return 1
          }
          check_url "http://localhost:3002/"
          check_url "http://localhost:5002/"
          check_url "http://localhost:6002/health"
      - name: Stop services
        if: always()
        working-directory: accommodation-service
        run: docker-compose down -v
  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]
    steps:
      - uses: actions/checkout@v4
      - name: Create reports directory
        working-directory: accommodation-service
        run: mkdir -p reports
      - name: Generate report.json
        working-directory: accommodation-service
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > reports/report.json << EOF
          {
            "workflow_name": "student-2",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_timestamp": "$TIMESTAMP"
          }
          EOF
      - name: Generate report.md
        working-directory: accommodation-service
        run: |
          cat > reports/report.md << EOF
          ## Student 2 (Accommodation Manager) Workflow Report
          - Workflow: student-2
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          EOF
      - name: Generate run-view.md
        working-directory: accommodation-service
        run: |
          cat > reports/run-view.md << EOF
          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: student-2-report
          path: accommodation-service/reports
