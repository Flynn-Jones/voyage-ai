name: student-2

# Accommodation (Student 2): lint + security, unit tests, image build, live endpoint tests, and a
# check that every AI path (MCP, RAG, Multi-Agent, AI-Mode) is disabled under docker-compose.ci.yml.
#
# Runs on EVERY push to main (no path filter) so every final commit gets its own student-2 run as
# post-commit evidence. GitHub allows a single push filter, so Accommodation's own student-2/**
# branches run unfiltered too; pull requests keep the Accommodation path filter. workflow_call lets
# cloud-deployment.yml re-run this whole workflow on the SHA it is about to deploy.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, "student-2/**"]
  pull_request:
    paths:
      - "accommodation-service/**"
      - "ai-services/multi-agent-server/workflows/accommodation_shortlist.py"
      - "ai-services/multi-agent-server/tests/test_accommodation_shortlist.py"
      - ".github/workflows/student-2.yml"

concurrency:
  group: student-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-security:
    name: lint-security (ruff S, detect-secrets, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners (same versions as .pre-commit-config.yaml)
        run: pip install ruff==0.17.1 detect-secrets==1.5.0 pip-audit==2.10.1
      - name: ruff (security rules)
        run: |
          if [ -f ruff.toml ]; then ruff check --config ruff.toml accommodation-service
          else ruff check --select E4,E7,E9,F,S --per-file-ignores "accommodation-service/tests/*:S101" accommodation-service; fi
      - name: detect-secrets
        run: |
          detect-secrets scan accommodation-service > accommodation-secrets.json
          python -c "import json,sys; r=json.load(open('accommodation-secrets.json'))['results']; print(r or 'no secrets found'); sys.exit(1 if r else 0)"
      - name: pip-audit (Accommodation requirements)
        run: |
          pip-audit -r accommodation-service/backend/requirements.txt --progress-spinner off
          pip-audit -r accommodation-service/frontend/requirements.txt --progress-spinner off
          pip-audit -r accommodation-service/database/requirements.txt --progress-spinner off

  unit-tests:
    name: unit-tests (routes, MAS mocked; accommodation_shortlist workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r accommodation-service/backend/requirements.txt pytest==9.1.1 -r ai-services/multi-agent-server/requirements-dev.txt
      - name: Accommodation backend unit tests
        working-directory: accommodation-service/backend
        run: python -m pytest --junitxml=junit-unit-tests.xml
      - name: accommodation_shortlist workflow tests (shared Multi-Agent Server)
        working-directory: ai-services/multi-agent-server
        run: python -m pytest tests/test_accommodation_shortlist.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-2-junit-unit-tests
          path: accommodation-service/backend/junit-unit-tests.xml

  build:
    name: build (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        working-directory: accommodation-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

  endpoint-tests:
    name: endpoint-tests (live containers)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Accommodation (MCP/RAG/Multi-Agent/AI disabled)
        working-directory: accommodation-service
        run: |
          docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for health
        run: |
          for url in http://localhost:6002/health http://localhost:5002/health http://localhost:3002/; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then echo "ready: $url"; continue 2; fi
              sleep 2
            done
            echo "not healthy: $url"; exit 1
          done
      - name: pytest (live endpoint tests)
        run: |
          pip install -r accommodation-service/tests/requirements.txt
          cd accommodation-service && python -m pytest -m live --junitxml=junit-endpoint-tests.xml -v
      # Reads the JUnit from the step above (no second run) and fails unless both endpoint
      # functions have a passing test - the live fixture skips when the stack is unreachable,
      # and an all-skipped run would otherwise pass.
      - name: Record the two endpoint-function tests from the live JUnit
        if: always()
        working-directory: accommodation-service
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          REQUIRED = {
              "test_post_valid_accommodation_is_201_and_reads_back":
                  "POST /accommodations -> create_accommodation (201, read back from the database)",
              "test_get_list_includes_created_record":
                  "GET /accommodations -> list_accommodations (lists the created record)",
          }
          status = {}
          try:
              for case in ET.parse("junit-endpoint-tests.xml").getroot().iter("testcase"):  # noqa: S314 - our own JUnit
                  if case.get("classname") == "tests.test_endpoints" and case.get("name") in REQUIRED:
                      bad = any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                      status[case.get("name")] = "FAIL" if bad else "PASS"
          except (OSError, ET.ParseError) as exc:
              print(f"live JUnit unreadable: {exc}")
          lines = ["## Post-commit endpoint tests (student-2 backend, live stack)", "",
                   "| Test | Endpoint function | Result |", "|---|---|---|"]
          lines += [f"| `tests/test_endpoints.py::{name}` | {what} | {status.get(name, 'MISSING')} |"
                    for name, what in REQUIRED.items()]
          open("endpoint-tests.md", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(0 if all(status.get(n) == "PASS" for n in REQUIRED) else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-2-junit-endpoint-tests
          path: |
            accommodation-service/junit-endpoint-tests.xml
            accommodation-service/endpoint-tests.md
      - name: Container logs on failure
        if: failure()
        working-directory: accommodation-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
      - name: Stop
        if: always()
        working-directory: accommodation-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  verify-ai-disabled:
    name: verify-ai-disabled (MCP, RAG, Multi-Agent, AI-Mode -> 403)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Accommodation with docker-compose.ci.yml
        working-directory: accommodation-service
        run: |
          docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:5002/health && break; sleep 2; done
      - name: Every AI route answers 403
        run: |
          fail=0
          check() {
            code=$(curl -s -o body.txt -w "%{http_code}" -X POST "http://localhost:5002$1" \
              -H "Content-Type: application/json" -d "$2")
            if [ "$code" = "403" ]; then echo "PASS $1 -> 403"
            else echo "FAIL $1 -> $code $(head -c 200 body.txt)"; fail=1; fi
          }
          check /accommodation/mcp/by-destination '{"destination":"Tokyo"}'
          check /accommodation/rag/refresh '{}'
          check /ai/recommend '{"destination_city":"Tokyo"}'
          check /accommodation/multi-agent/run '{"destination":"Tokyo","budget_cap":150}'
          exit $fail
      - name: Stop
        if: always()
        working-directory: accommodation-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
