name: student-4

# Budget (Student 4): lint + security, unit tests, image build, live endpoint tests, and a check
# that every AI path (MCP, RAG, Multi-Agent, AI-Mode) is disabled under docker-compose.ci.yml.
#
# Runs on EVERY push to main (no path filter) so the cloud-deployment gate always finds a
# student-4 run for the commit it deploys. GitHub allows a single push filter, so Budget's own
# student-4/** branches run unfiltered too; pull requests keep the Budget path filter.
on:
  workflow_dispatch:
  push:
    branches: [main, "student-4/**"]
  pull_request:
    paths:
      - "budget-service/**"
      - "ai-services/multi-agent-server/workflows/budget_reconcile.py"
      - "ai-services/multi-agent-server/tests/test_budget_reconcile.py"
      - ".github/workflows/student-4.yml"

concurrency:
  group: student-4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-security:
    name: lint-security (ruff S, detect-secrets, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners (same versions as .pre-commit-config.yaml)
        run: pip install ruff==0.17.1 detect-secrets==1.5.0 pip-audit==2.10.1
      - name: ruff (security rules)
        run: |
          if [ -f ruff.toml ]; then ruff check --config ruff.toml budget-service
          else ruff check --select E4,E7,E9,F,S --per-file-ignores "budget-service/tests/*:S101" budget-service; fi
      - name: detect-secrets
        run: |
          detect-secrets scan budget-service > budget-secrets.json
          python -c "import json,sys; r=json.load(open('budget-secrets.json'))['results']; print(r or 'no secrets found'); sys.exit(1 if r else 0)"
      - name: pip-audit (Budget requirements)
        run: |
          pip-audit -r budget-service/budget-be/requirements.txt --progress-spinner off
          pip-audit -r budget-service/budget-db/requirements.txt --progress-spinner off

  unit-tests:
    name: unit-tests (routes, MAS mocked; budget_reconcile workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r budget-service/tests/requirements.txt -r ai-services/multi-agent-server/requirements-dev.txt
      - name: Budget backend unit tests
        working-directory: budget-service
        run: python -m pytest -m "not live" --junitxml=junit-unit-tests.xml
      - name: budget_reconcile workflow tests (shared Multi-Agent Server)
        working-directory: ai-services/multi-agent-server
        run: python -m pytest tests/test_budget_reconcile.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-4-junit-unit-tests
          path: budget-service/junit-unit-tests.xml

  build:
    name: build (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        working-directory: budget-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

  endpoint-tests:
    name: endpoint-tests (live containers)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Budget (MCP/RAG/Multi-Agent/AI disabled)
        working-directory: budget-service
        run: |
          docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for health
        run: |
          for url in http://localhost:6004/health http://localhost:5004/health http://localhost:3004/; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then echo "ready: $url"; continue 2; fi
              sleep 2
            done
            echo "not healthy: $url"; exit 1
          done
      - name: pytest (live endpoint tests + AI-proposed cases)
        run: |
          pip install -r budget-service/tests/requirements.txt
          cd budget-service && python -m pytest -m live --junitxml=junit-endpoint-tests.xml -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-endpoint-tests
          path: budget-service/junit-endpoint-tests.xml
      - name: Container logs on failure
        if: failure()
        working-directory: budget-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
      - name: Stop
        if: always()
        working-directory: budget-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  verify-ai-disabled:
    name: verify-ai-disabled (MCP, RAG, Multi-Agent, AI-Mode -> 403)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Budget with docker-compose.ci.yml
        working-directory: budget-service
        run: |
          docker network inspect microservices-net >/dev/null 2>&1 || docker network create microservices-net
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:5004/health && break; sleep 2; done
      - name: Every AI route answers 403
        run: |
          fail=0
          check() {
            code=$(curl -s -o body.txt -w "%{http_code}" -X POST "http://localhost:5004$1" \
              -H "Content-Type: application/json" -d "$2")
            if [ "$code" = "403" ] && grep -qi "disabled" body.txt; then echo "PASS $1 -> 403 disabled"
            else echo "FAIL $1 -> $code $(head -c 200 body.txt)"; fail=1; fi
          }
          check /budget/mcp/list-expenses '{"trip_reference":"TRIP-1001"}'
          check /budget/rag/refresh '{}'
          check /budget/rag/answer '{"query":"What did I spend?"}'
          check /budget/multi-agent/run '{"trip_reference":"TRIP-1001","budget_cap":1300}'
          check /budget/ai-analyse '{"trip_reference":"TRIP-1001"}'
          check /budget/ai-add-expense '{"request":"Add a taxi for 20 dollars"}'
          exit $fail
      - name: Stop
        if: always()
        working-directory: budget-service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
