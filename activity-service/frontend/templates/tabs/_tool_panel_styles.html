{# Panel styles shared by mcp_mode.html and rag_mode.html. .act-tabstrip lives
   in styles.css; the .act-chat__* rules reused here (log, form, pending
   bubble, empty state) are defined in ai_mode.html, so the few these pages
   need are repeated below verbatim. #}
<style>
  .act-chat__log {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    background: var(--act-white);
    border: 1px solid var(--act-border);
    border-radius: var(--act-radius);
    box-shadow: var(--act-shadow);
  }

  .act-chat__bubble {
    padding: 10px 14px;
    border-radius: var(--act-radius);
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .act-chat__bubble--pending {
    background: var(--act-offwhite);
    color: var(--act-text-muted);
    font-style: italic;
    border: 1px dashed var(--act-border);
    margin-bottom: 10px;
  }

  /* htmx only fades the indicator (opacity: 0); collapse it between requests
     so it doesn't leave a gap above the call log. */
  .act-pending:not(.htmx-request) { display: none; }

  .act-chat__empty {
    color: var(--act-text-muted);
    font-style: italic;
    margin: auto;
  }

  .act-chat__form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .act-chat__form input[type="text"],
  .act-chat__form select {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border: 1px solid var(--act-border);
    border-radius: var(--act-radius);
    background: var(--act-offwhite);
    color: var(--act-text);
    min-width: 0;
  }

  .act-chat__form input[type="text"] { flex: 1; }
  .act-chat__form input:disabled { color: var(--act-text-muted); opacity: 0.6; }

  .act-chat__form input[type="text"]:focus,
  .act-chat__form select:focus {
    outline: none;
    border-color: var(--act-red);
    background: var(--act-white);
  }

  /* MCP-specific */
  .act-mcp {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .act-mcp { grid-template-columns: minmax(0, 1fr); }
  }

  .act-mcp h2 {
    font-size: 1rem;
    color: var(--act-maroon);
    margin: 0 0 10px;
  }

  /* Rounded card around the tools table. border-radius has no effect on a
     border-collapse table, so the card lives on a wrapper; overflow clips the
     table's corners to it. */
  .act-mcp__box {
    margin-bottom: 24px;
    background: var(--act-white);
    border: 1px solid var(--act-border);
    border-radius: var(--act-radius);
    box-shadow: var(--act-shadow);
    overflow: hidden;
  }

  .act-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Custom dropdown standing in for the native tool select */
  .act-select { position: relative; }

  .act-select__button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border: 1px solid var(--act-border);
    border-radius: var(--act-radius);
    background: var(--act-offwhite);
    color: var(--act-text);
    cursor: pointer;
    white-space: nowrap;
  }

  .act-select__button::after {
    content: "";
    width: 7px;
    height: 7px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: translateY(-2px) rotate(45deg);
    transition: transform 0.15s;
  }

  .act-select__button[aria-expanded="true"]::after { transform: translateY(2px) rotate(-135deg); }

  .act-select__button:focus-visible,
  .act-select__button[aria-expanded="true"] {
    outline: none;
    border-color: var(--act-red);
    background: var(--act-white);
  }

  .act-select__list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 100%;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--act-white);
    border: 1px solid var(--act-border);
    border-radius: var(--act-radius);
    box-shadow: var(--act-shadow);
    z-index: 20;
  }

  .act-select__list li {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    white-space: nowrap;
    cursor: pointer;
  }

  .act-select__list li.is-active { background: var(--act-rose); }
  .act-select__list li[aria-selected="true"] { color: var(--act-maroon); font-weight: 600; }

  .act-mcp__tools {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .act-mcp__tools th,
  .act-mcp__tools td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--act-border);
    vertical-align: top;
  }

  .act-mcp__tools th { color: var(--act-text-muted); font-weight: 600; }
  .act-mcp__tools tr:last-child td { border-bottom: none; }

  .act-mcp__log {
    min-height: 320px;
    max-height: 640px;
    overflow-y: auto;
  }

  .act-mcp__call {
    border: 1px solid var(--act-border);
    border-left: 4px solid var(--act-red);
    border-radius: var(--act-radius);
    padding: 12px 14px;
    background: var(--act-white);
    font-size: 0.85rem;
  }

  .act-mcp__call--error { border-left-color: var(--act-maroon); background: var(--act-rose); }

  .act-mcp__call-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .act-mcp__call-head code { font-weight: 700; color: var(--act-maroon); }

  .act-mcp__status {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--state-on-bg);
    color: var(--state-on-fg);
    white-space: nowrap;
  }

  .act-mcp__status--error { background: var(--state-off-bg); color: var(--state-off-fg); }

  .act-mcp__label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--act-text-muted);
    margin: 8px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .act-mcp__call pre {
    margin: 0;
    padding: 8px 10px;
    background: var(--act-offwhite);
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow: auto;
  }

  .act-mcp__call details summary { cursor: pointer; color: var(--act-text-muted); margin-top: 8px; }
  .act-mcp__error { color: var(--act-maroon); font-weight: 600; margin: 4px 0 0; }

  .act-mcp__answer {
    margin: 0;
    padding: 10px 12px;
    background: var(--act-rose);
    border-radius: 8px;
    font-size: 0.95rem;
    line-height: 1.45;
    color: var(--act-text);
  }

  .act-mcp__note { color: var(--act-text-muted); font-style: italic; margin: 8px 0 0; }
</style>
