<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoyageAI — Register an Activity</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav class="voyage-nav">
    <div class="voyage-nav__container">
      <span class="voyage-nav__brand">VoyageAI &mdash; Activities</span>
      <div class="voyage-nav__links">
        <a href="../index.html">Activities</a>
        <a href="ai-mode.html">AI Mode</a>
        <a href="register-activity.html" class="is-active">Register Activity</a>
      </div>
      <div class="voyage-nav__switcher">
        <a href="http://localhost:3000">Home</a>
        <a href="http://localhost:3001">Destinations</a>
        <a href="http://localhost:3002">Accommodation</a>
        <a href="http://localhost:3003" class="is-active">Activities</a>
        <a href="http://localhost:3004">Budget</a>
        <a href="http://localhost:3005">Itinerary</a>
      </div>
    </div>
  </nav>

  <main class="act-main">
    <a href="../index.html" class="act-btn act-btn--secondary act-back-link">&larr; Back to Home</a>
    <h1 id="page-title" class="act-section-title">Register a New Activity</h1>

    <div id="feedback" class="act-banner"></div>

    <form id="activity-form" class="act-form">
      <div class="act-field">
        <label for="activity_name">Activity Name</label>
        <input type="text" id="activity_name" name="activity_name" required>
      </div>

      <div class="act-field">
        <label for="activity_type">Activity Type</label>
        <input type="text" id="activity_type" name="activity_type" placeholder="e.g. Sightseeing, Adventure, Food" required>
      </div>

      <div class="act-field">
        <label for="activity_cost">Cost (USD)</label>
        <input type="number" id="activity_cost" name="activity_cost" min="0" step="0.01" required>
      </div>

      <div class="act-field">
        <label for="duration">Duration</label>
        <input type="text" id="duration" name="duration" placeholder="e.g. 2 hours" required>
      </div>

      <div class="act-field">
        <label for="assignment_time">Recommended / Assigned Time</label>
        <input type="datetime-local" id="assignment_time" name="assignment_time" required>
        <small>Schedules this activity into a time slot.</small>
      </div>

      <button type="submit" id="submit-button" class="act-btn">Register Activity</button>
    </form>
  </main>

  <footer class="act-footer">
    VoyageAI — Activity Manager
  </footer>

  <script src="../js/api.js"></script>
  <script>
    const form = document.getElementById("activity-form");
    const feedback = document.getElementById("feedback");
    const pageTitle = document.getElementById("page-title");
    const submitButton = document.getElementById("submit-button");

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = `act-banner act-banner--visible act-banner--${type}`;
    }

    const params = new URLSearchParams(window.location.search);
    const editId = params.get("id");

    async function prefillForEdit(id) {
      pageTitle.textContent = "Edit Activity";
      document.title = "VoyageAI — Edit Activity";
      submitButton.textContent = "Save Changes";
      submitButton.disabled = true;

      try {
        const [activity, assignments] = await Promise.all([
          getActivity(id),
          getActivityAssignments(id).catch(() => []),
        ]);

        form.activity_name.value = activity.activity_name ?? "";
        form.activity_type.value = activity.activity_type ?? "";
        form.activity_cost.value = activity.activity_cost ?? "";
        form.duration.value = activity.duration ?? "";
        if (assignments && assignments.length > 0) {
          form.assignment_time.value = assignments[0].assignment_time ?? "";
        }
      } catch (error) {
        showFeedback(`Could not load activity ${id}: ${error.message}`, "error");
      } finally {
        submitButton.disabled = false;
      }
    }

    if (editId) {
      prefillForEdit(editId);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      feedback.className = "act-banner";

      const formData = new FormData(form);
      const payload = {
        activity_name: formData.get("activity_name").trim(),
        activity_type: formData.get("activity_type").trim(),
        activity_cost: parseFloat(formData.get("activity_cost")),
        duration: formData.get("duration").trim(),
        assignment_time: formData.get("assignment_time"),
      };

      submitButton.disabled = true;

      try {
        if (editId) {
          await editActivity(editId, payload);
          showFeedback("Activity updated successfully. Returning to the activity list…", "success");
          setTimeout(() => {
            window.location.href = `activities.html?id=${encodeURIComponent(editId)}`;
          }, 1200);
          return;
        }

        await addActivity(payload);
        showFeedback("Activity registered successfully.", "success");
        form.reset();
      } catch (error) {
        const verb = editId ? "update" : "register";
        showFeedback(`Could not ${verb} activity: ${error.message}`, "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
