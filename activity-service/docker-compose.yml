# STUDENT 3 MICROSERVICE — its own independent project.
# Ports: frontend 3003 (container 3004), backend 5003, database 6003.

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3003:3004"            # host 3003 (navbar link); Flask listens on 3004 internally (PORT default in app.py)
    environment:
      # app.py defaults to http://activity-backend:5003 (the root compose's
      # service name); in this standalone file the backend service is "backend".
      - BACKEND_SERVICE_URL=http://backend:5003
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5003:5003"
    environment:
      - DATABASE_SERVICE_URL=http://database:6003
      - ACCOMMODATION_SERVICE_URL=http://accomodation-db:6002
      # Overridable via activity-service/.env — see .env.example for the
      # documented variable names and defaults.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # qwen2.5:7b (the original choice here) isn't pulled locally; using the
      # smaller already-available qwen2.5:0.5b instead, per John's call.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
      # Release 1: ONE shared MCP (:7001) and RAG (:7002) server for every
      # feature — ai-services/mcp-server and ai-services/rag-server, run on the
      # host (not containerised), reached the same way as Ollama. Set
      # ACTIVITY_MCP_ENABLED / ACTIVITY_RAG_ENABLED=false to turn every
      # /api/activity/mcp/* or /api/activity/rag/* route into a 403.
      - MCP_SERVICE_URL=${ACTIVITY_MCP_SERVICE_URL:-http://host.docker.internal:7001}
      - MCP_ENABLED=${ACTIVITY_MCP_ENABLED:-true}
      - RAG_SERVICE_URL=${ACTIVITY_RAG_SERVICE_URL:-http://host.docker.internal:7002}
      - RAG_ENABLED=${ACTIVITY_RAG_ENABLED:-true}
    volumes:
      # prompts/mcp/ for /api/activity/mcp/ask — the build context is
      # ./backend, so the prompts can't be COPY'd into the image. ",z" lets
      # SELinux hosts (e.g. Fedora) read the mount; a no-op elsewhere.
      - ./prompts:/prompts:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
    networks:
      - internal
      - microservices-net

  database:
    build: ./database-service
    container_name: activity-service-database  # renamed from "database-service": that name
                                                # collides with an unrelated project's container
                                                # on this machine (enrolment-app-open-ai)
    ports:
      - "6003:6003"
    environment:
      - ACTIVITY_DB_PATH=/data/database-service.sqlite
    volumes:
      - database-service-data:/data
    networks:
      - internal
      - microservices-net

networks:
  internal:
    driver: bridge
  microservices-net:
    external: true

volumes:
  database-service-data:
