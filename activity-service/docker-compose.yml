# STUDENT 4 MICROSERVICE — its own independent project.
# Ports: frontend 3004, backend 5003, database 6003 (external == internal, per-feature numbered).

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3004:3004"            # Flask app listens on 3004 internally (PORT default in app.py)
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5003:5003"
    environment:
      - DATABASE_SERVICE_URL=http://database:6003
      - ACCOMMODATION_SERVICE_URL=http://accomodation-db:6002
      # Required for activity_store.py's direct-SQLite writes to land in the
      # same file database-service reads — must match the env var below and
      # the shared volume mount (neither existed on this service before).
      - ACTIVITY_DB_PATH=/data/database-service.sqlite
      # Overridable via activity-service/.env — see .env.example for the
      # documented variable names and defaults.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # qwen2.5:7b (the original choice here) isn't pulled locally; using the
      # smaller already-available qwen2.5:0.5b instead, per John's call.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      - database-service-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
    networks:
      - internal
      - microservices-net

  database:
    build: ./database-service
    container_name: activity-service-database  # renamed from "database-service": that name
                                                # collides with an unrelated project's container
                                                # on this machine (enrolment-app-open-ai)
    ports:
      - "6003:6003"
    environment:
      - ACTIVITY_DB_PATH=/data/database-service.sqlite
    volumes:
      - database-service-data:/data
    networks:
      - internal
      - microservices-net

networks:
  internal:
    driver: bridge
  microservices-net:
    external: true

volumes:
  database-service-data:
